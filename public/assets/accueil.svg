@keyframes flPip{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){
  .fl-orb,.fl-card,.fl-phone,.fl-bubble,.fl-dot,.fl-ring,.fl-pip{animation:none}
}
